# Production deployment for Hetzner VPS
# Zero-downtime deploys via blue-green with shared network.
# Caddy runs standalone. App services alternate between blue/green projects.

services:
  # Next.js frontend
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INTERNAL_API_URL: http://api:3001
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:-api.smry.ai}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_PATRON_PLAN_ID: ${NEXT_PUBLIC_CLERK_PATRON_PLAN_ID}
        NEXT_PUBLIC_URL: https://${APP_DOMAIN:-smry.ai}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:3001
      CLASSIFIER_URL: http://classifier:8000
      CLASSIFIER_ENABLED: "true"
    depends_on:
      classifier:
        condition: service_healthy
    networks:
      smry:

  # Elysia API server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CORS_ORIGIN: https://${APP_DOMAIN:-smry.ai}
      CLASSIFIER_URL: http://classifier:8000
      CLASSIFIER_ENABLED: "true"
    depends_on:
      classifier:
        condition: service_healthy
    networks:
      smry:

  # Python/XGBoost article classifier
  classifier:
    build:
      context: ./classifier
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      smry:

networks:
  smry:
    external: true
