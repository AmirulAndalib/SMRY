name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /opt/smry
            git fetch origin main
            git reset --hard origin/main

            # Build new images
            docker compose -f docker-compose.prod.yml build

            # Rolling restart: classifier first (others depend on it)
            docker compose -f docker-compose.prod.yml up -d --no-deps classifier
            echo "Waiting for classifier healthcheck..."
            sleep 12

            # Then api and app
            docker compose -f docker-compose.prod.yml up -d --no-deps api
            sleep 5
            docker compose -f docker-compose.prod.yml up -d --no-deps app
            sleep 3

            # Ensure caddy is running
            docker compose -f docker-compose.prod.yml up -d --no-deps caddy

            # Wait for services to stabilize
            sleep 5

            # Verify health through Caddy reverse proxy
            API_HEALTH=$(curl -sf --retry 3 --retry-delay 5 https://api.smry.ai/health 2>/dev/null)
            if echo "$API_HEALTH" | grep -q '"status":"ok"'; then
              echo "API: healthy"
            else
              echo "API: unhealthy"
              docker compose -f docker-compose.prod.yml logs api --tail=20
              exit 1
            fi

            echo "Deploy complete"

            # Cleanup old images
            docker image prune -f
