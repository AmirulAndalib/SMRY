name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /opt/smry
            git fetch origin main
            git reset --hard origin/main

            # Build new images (existing containers keep serving traffic)
            docker compose -f docker-compose.prod.yml build

            # Rolling restart: classifier first (others depend on it)
            # --no-deps prevents touching other containers
            docker compose -f docker-compose.prod.yml up -d --no-deps classifier
            echo "Waiting for classifier healthcheck..."
            sleep 12

            # Then api and app (one at a time)
            docker compose -f docker-compose.prod.yml up -d --no-deps api
            sleep 5
            docker compose -f docker-compose.prod.yml up -d --no-deps app

            # NEVER recreate Caddy during deploys — it causes downtime.
            # Only restart Caddy manually if the Caddyfile changes.

            # Verify health
            sleep 5
            for i in 1 2 3; do
              if curl -sf https://api.smry.ai/health | grep -q '"status":"ok"'; then
                echo "API: healthy"
                echo "Deploy complete"
                docker image prune -f
                exit 0
              fi
              echo "Attempt $i: waiting..."
              sleep 5
            done

            echo "API: unhealthy after retries"
            docker compose -f docker-compose.prod.yml logs api --tail=20
            exit 1
