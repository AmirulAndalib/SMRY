# Caddy reverse proxy — runs independently from app deploys.
# Start once: docker compose -f docker-compose.caddy.yml up -d
# Never restarted during deployments.

services:
  caddy:
    image: caddy:2-alpine
    container_name: smry-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      smry:

volumes:
  caddy_data:
  caddy_config:

networks:
  smry:
    external: true
